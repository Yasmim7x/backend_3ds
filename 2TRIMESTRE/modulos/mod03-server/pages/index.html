<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁGINA INICIAL | K-POP</title>
    <script src="https://unpkg.com"></script>
    <link rel="stylesheet" href="/public/estilo.css">

    
</head>
<body>

    <main>
        <!-- Conteúdo Principal -->
        <section class="content">
            <div class="badge">
                <i data-lucide="music-4" style="width: 16px; height: 16px;"></i>
                <span>All Kill Area</span>
            </div>
            
            <h3>PÁGINA HOME</h3>
            
            <p>Sinta a batida, acompanhe os fanchants e viva a experiência completa da cultura pop coreana. O universo dos seus idols favoritos reunido em um espaço vibrante feito de fã para fã.</p>
            
            <!-- Grupo de botões com links originais intocados -->
            <div class="button-group">
                <a href="/sobre" class="cta-link">
                    <span>PÁGINA SOBRE NÓS</span>
                    <i data-lucide="sparkles" style="width: 18px; height: 18px;"></i>
                </a>
                <a href="/404" class="cta-link secondary">
                    <span>404 ERROR</span>
                    <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                </a>
            </div>
        </section>
        
        <!-- COLUNA DA DIREITA: Sua Imagem -->
        <section class="image-column">
            <img src="https://capricho.abril.com.br/wp-content/uploads/2019/12/destaque-bts-bighit-entertainmente28099.jpeg?crop=1&resize=1212,909" alt="Destaque K-Pop">
        </section>

    </main>

    <!-- Inicialização dos ícones Lucide -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
